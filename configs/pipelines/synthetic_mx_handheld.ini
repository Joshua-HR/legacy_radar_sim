# ===================================================================
# Synthetic CIR (radar ego motion) -> MX postprocessing replay preset
# ===================================================================
# Identical to synthetic_mx_validation.ini except for
# [synthetic] default_syn_config_path, which selects the platform INI that
# carries a [radar_motion] section (hand tremor).
#
# Diff this against synthetic_mx_validation.ini, and
# configs/cirgen_configs/platform_2d_legacy_handheld.ini against
# configs/cirgen_configs/platform_2d_legacy.ini, to see the ego-motion delta
# in isolation.
#
# Radar ego motion is PHYSICS/GEOMETRY, so it lives in the platform INI, not
# here: the wrapper [synthetic] section only composes scenarios by name
# (hardware/room/target profile). See docs/radar_wrapper_operation.md and
# docs/ego_motion_model.md.
#
# Expect this run to differ from synthetic_mx_validation.ini: every static
# clutter and target tap picks up a slow-time phase modulation, which is
# exactly what defeats clutter cancellation on a handheld device. Detection
# counts and range errors are therefore NOT expected to match the static run.

[run]
name = synthetic_mx_handheld

[input]
source = synthetic

[synthetic]
default_syn_config_path = configs/cirgen_configs/platform_2d_legacy_handheld.ini
scenario_name = breathing_human_anechoic_like_handheld
hardware_profile = ideal_lab
room_profile = anechoic_like
target_profile = breathing_human

[postprocess]
backend = mx

[mx]
cfar_threshold = 7.0
input_gain = 1.0
min_dynamic_excess_db = 8
skip_bins = 5
min_range_cm = 75.0
enable_static_detection = true
require_baseline_for_human = false
min_abs_velocity_mps = 0.06

ingest_mode = hex

; configuration to use 'hex' mode
q_format = q8_8
q_format_scale = 256
q_format_overflow = saturate

ant_bitmap_list = 0101,0201

# slow_time_size intentionally not set here: it is a hex-path-only knob and
# configs/default.ini carries the legacy value (16). The "256" that used to
# sit here never took effect (mx_adapter.py leg the radar_utils module
# constant win); setting it now WOULD take effect, so it is left to the
# default rather than silently changing this preset's behaviour.
flush_tail_segment = true
use_threads = false

verbose_import = false
verbose_push = false

[visualization]
enabled = true
show = false
save = true
