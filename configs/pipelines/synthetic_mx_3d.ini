# ===================================================================
# Synthetic CIR (3D geometry_mode + antenna pattern) -> MX replay
# ===================================================================
# Same as synthetic_mx_smoke.ini but points default_syn_config_path
# at configs/cirgen_configs/platform_3d_isotropic.ini, which enables
# [scene] geometry_mode = 3d (radar mounted at radar_height_z_m above the
# floor-level target) on top of pattern_mode = table_3d with per-antenna
# measured patterns. This is the config that actually exercises a
# theta_deg != 90 (non-horizon) pattern lookup during the run, since
# geometry_mode=3d shifts the radar-to-target polar angle away from the
# flat-scene default. Detection thresholds are relaxed so the synthetic
# CIR simulator produces visible detections.

[run]
name = synthetic_mx_replay_3d

[input]
source = synthetic

[synthetic]
default_syn_config_path = configs/cirgen_configs/platform_3d_isotropic.ini
scenario_name = static_human_anechoic_like
hardware_profile = ideal_lab
room_profile = anechoic_like
target_profile = static_human

[postprocess]
backend = mx

[mx]
cfar_threshold = 0.0
input_gain = 1.0
min_dynamic_excess_db = 0.0
skip_bins = 0
min_range_cm = 0.0
enable_static_detection = true
require_baseline_for_human = false
min_abs_velocity_mps = 0.0

ingest_mode = complex

; configuration to use 'hex' mode
q_format = q8_8
q_format_scale = 256
q_format_overflow = saturate

ant_bitmap_list = 0101,0201

# slow_time_size intentionally not set here: it is a hex-path-only knob and
# configs/default.ini carries the legacy value (16). The "256" that used to
# sit here never took effect (mx_adapter.py leg the radar_utils module
# constant win); setting it now WOULD take effect, so it is left to the
# default rather than silently changing this preset's behaviour.
flush_tail_segment = true
use_threads = false

verbose_import = false
verbose_push = false

[visualization]
enabled = true
show = false
save = true
