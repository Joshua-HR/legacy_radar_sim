# ===================================================================
# Synthetic CIR -> MX postprocessing replay preset
# ===================================================================
# Overrides applied on top of configs/default.ini
# Detection thresholds are relaxed so that the synthetic CIR simulator
# produces visible detections for the MVP smoke test.

[run]
name = synthetic_mx_replay

[input]
source = synthetic

[synthetic]
default_syn_config_path = configs/cirgen_configs/platform_2d_legacy.ini
scenario_name = breathing_human_anechoic_like
hardware_profile = ideal_lab
room_profile = anechoic_like
target_profile = breathing_human

[postprocess]
backend = mx

[mx]
cfar_threshold = 7.0
input_gain = 1.0
min_dynamic_excess_db = 8
skip_bins = 5
min_range_cm = 75.0
enable_static_detection = true
require_baseline_for_human = false
min_abs_velocity_mps = 0.06

ingest_mode = hex

; configuration to use `hex` mode
q_format = q8_8
q_format_scale = 256
q_format_overflow = saturate

ant_bitmap_list = 0101,0201

slow_time_size = 256
flush_tail_segment = true
use_threads = false

verbose_import = false
verbose_push = false

[visualization]
enabled = true
show = false
save = true
