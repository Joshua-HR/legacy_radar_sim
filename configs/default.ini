# ===================================================================
# radar_wrapper default configuration
# ===================================================================
# This file provides sensible defaults.  Scenario-specific INI files
# (e.g. configs/pipelines/synthetic_mx_smoke.ini) should only override the keys
# they need to change.
# ===================================================================

[run]
name = default_run
mode = replay
output_root = outputs/runs
save_resolved_config = true

[input]
source = synthetic

[synthetic]
# default_syn_config_path selects the CIRgenerator "platform" base ini
# (physics / geometry / patterns + its own default [profiles]).
default_syn_config_path = configs/cirgen_configs/platform_2d_legacy.ini
output_root = outputs/synthetic
# NOTE: hardware_profile / room_profile / target_profile / scenario_name are
# intentionally NOT set here. The selected platform ini's [profiles] supplies
# the defaults; per-scenario pipeline configs (configs/pipelines/*.ini) override
# them (override-if-present, logged by SyntheticCIRSource). Keeping them out of
# this base layer is what lets an omitted key genuinely defer to the platform ini.

[measured]
path = data/measured/sample_001.npz
format = npz

[radar]
channel = 9
num_antennas = 2
num_taps = 64
pri_s = 0.005   ; For estimation of velocity 1 m/s
fast_time_resolution_ns = 1.0
center_frequency_hz = 7987000000
rx1_gain = 30
rx2_gain = 30

[postprocess]
# mx      : MX Doppler/detection backend (implemented)
# rftests : RFtests backend (validates here, raises NotImplementedError downstream)
# none    : CIR-only. Runs the source, writes cir_data.npz / cir_metadata.json /
#           truth.json, writes empty detection artifacts for layout uniformity,
#           and skips the detection plots. Use it when the observable is the CIR
#           itself (physics / geometry validation) and a detection pass would
#           only add cost and threshold sensitivity.
backend = mx

[mx]
segment_size = 32
hop_size = 0
cfar_threshold = 7.0
skip_bins = 5
min_range_cm = 75.0
max_range_cm = 300.0
min_abs_velocity_mps = 0.0
calib_segments = 3
min_dynamic_excess_db = 6.0
min_cells = 2
min_unique_taps = 2
min_range_span_cm = 15.0
persistence_window = 4
persistence_hits = 2
persistence_range_cm = 45.0
reject_edge_doppler_bins = 1
adaptive_baseline_update = true
adaptive_baseline_alpha = 0.03
adaptive_baseline_guard_db = 12.0
require_baseline_for_human = true
enable_static_detection = false

ingest_mode = hex

q_format = q8_8
q_format_scale = 256
q_format_overflow = saturate

ant_bitmap_list = 0101,0201

# --- hex-path-only -------------------------------------------------------
# These two are the ONLY detection-relevant values ingest_mode = hex can
# honour. RadarPostprocessing (hex) takes no thresholds in its constructor and
# never sees ConfigMapper.build_mx_params(), so every other threshold in this
# section applies to ingest_mode = complex only. radar_wrapper/config.py warns
# when an inert one is set under hex.
#
# The values below are the legacy module constants
# (MX_CodeV1_Mustafa/test_modules/radar_utils.py SEGMENT_LENGTH = 16,
# THRESHOLD = 8). Until 2026-08-26 mx_adapter.py read them as
# getattr(module, NAME, cfg_value), so the module constant always won and this
# section could not influence the hex path at all; the precedence is now
# config-first, and these defaults reproduce the previous behaviour exactly.
# Chaning them now actually takes effect.
#
# slow_time_size is the hex segment length (frames per FFT). Doppler bin
# spacing is 1/(slow_time_size * pri_s), so 16 frames at a 5 ms period gives
# 12.5 Hz bins -- far too coarse to resolve a ~0.3 Hz breathing tone. Use
# ingest_mode = complex with [mx] segment_size for micro-Doppler work; see
# docs/standard_validation_geometry.md (slow-time regimes).
slow_time_size = 16
hex_cfar_threshold_db = 8.0
flush_tail_segment = true
use_threads = false


[rftests]
config_template = RFtestsUCI2_0_Adam/config.ini
generated_config_name = generated_rftests_config.ini
input_bridge_format = npz

[visualization]
enabled = true
show = false
save = true
range_angle = true
range_time = true
range_doppler = false
power_histogram = false
