; Phase 1 geometry validation platform INI (docs/cirgen_validation_report_ko.md)
; Config-only "DSK ver 0.0 (2D)" ablation of the current 3D code
; (HEAD ~= DSK ver 2.0), NOT a checkout of any historical commit -- se
; report Sec 1.1/1.2.
;
; Design rule: within each condition (noisefree/noisy/fitted), the 2D and 3D
; sibling INI differ in EXACTLY the [scene] geometry_mode line below (kept
; as its own block with radar_height_z_m repeated identically -- inert
; under 2d_legacy -- purely so a plain `diff` of the two files shows one
; changed line and nothing else).

[scene]
geometry_mode = 2d_legacy
; Radar height above floor. Inert under 2d_legacy (rz forced to 0.0 in
; _radar_origin()/_build_antenna_positions()); Kept identical in both
; siblings so `diff` shows only the geometry_mode line changing.
radar_height_z_m = 1.2

[simulation]
num_antennas = 2

[antenna]
antenna_spacing_m = 0.019
; 7987.2 MHz = IEEE 802.15.4a/z UWB Channel 9 center frequency.
carrier_freq_hz = 7987200000.0
; isotropic (not table/table_3d): Phase 1's question is "what does geometry
; alone change", so the antenna pattern is held gain=1.0 in all directions
; for all 6 Phase 1 configs. table_3d's antenna-pattern effect is already
; documented separately in docs/2d_to_3d_migration.md Sec 10 and is out of
; scope here -- mixing it in would confound the geometry-only comparison.
pattern_mode = isotropic
boresight_deg = 0.0
boresight_phi_deg = 0.0
boresight_theta_deg = 0.0
min_gain = 0.05

; Round-trip radar-equation path-loss model -- see docs/friis_path_loss_model.md.
target_path_loss_exp = 2.0
clutter_path_loss_exp = 2.3
reflection_path_loss_exp = 2.5
path_loss_ref_distance_m = 1.0
path_loss_floor_m = 0.1
path_loss_ref_gain = 1186.830373866022

[cir]
num_bins = 256
bin_time_s = 0.0000000010016
num_frames = 512
; INERT under hardware_profile=fitted: apply_case_params_to_cfg()
; (CIRgenerator/impairment_params.py) overwrites cfg.cir.noise_std from
; the fit JSON's noise.std_per_ant. Kept here only so this INI's [cir]
; block matches the noisy sibling textually.
noise_std = 0.02

[frontend]
enable_quantization = false
enable_adc_clipping = false
enable_frame_drift = false

[radar]
test_name = RADAR1
cir_taps = 256
; period unit ms; 20 ms matches the UA200 hardware capture rate used
; elsewhere in this project (case0.log/case1.log), so Phase 1's Doppler
; axis (frame rate 50 Hz) is directly comparable to Phase 2/3.
period = 20

[build]
build_date = 2026-08-19 00:00:00

# The [profiles] values here are DEFAULTS for standalone/notebook callers of
# create_default_config(). radar_wrapper's SyntheticCIRSource overrides
# hardware_profile/room_profile/target_profile/scenario_name from its own
# [synthetic] section when present (override-if-present) -- this report's
# script always supplies all three explicitly per Phase 1 cell, so these
# defaults are never actually read through the wrapper path; they exist so
# this INI is also directly usable/inspectable standalone.
[profiles]
hardware_profile = fitted
hardware_params_json = data/params/case0_params.json
room_profile = anechoic_like
target_profile = breathing_human
