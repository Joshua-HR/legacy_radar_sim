; platform_2d_legacy_handheld.ini
; platform_2d_legacy.ini + radar ego motion (handheld hand tremor).
;
; This is the only difference from platform_2d_legacy.ini: the [radar_motion]
; section at the END of this file. Everything above it is a verbatim copy, so
; diff the two files to see the ego-motion delta in isolation.
;
; WARNING: this file therefore carries a 14th copy of
; [antenna] path_loss_ref_gain. That constant is duplicated across every
; platform INI and MUST be changed in all of them together - see CLAUDE.md
; and docs/friis_path_loss_model.md section 11.

; synthetic_default.ini
; Default configuration for CIRDataGenerator synthetic radar simulation.
; This file replaces the hard-coded defaults in create_default_config().

[simulation]
num_antennas = 2

[antenna]
antenna_spacing_m = 0.019
; 7987.2 MHz - IEEE 802.15.4a/z UWB Channel 9 center frequency.
carrier_freq_hz = 7987200000.0
pattern_mode = table
boresight_deg = 0.0
min_gain = 0.05

; Round-trip radar-equation path-loss model (scattered echoes ONLY):
; amplitude ~ lambda(sqrt(rcs_m2)/((4*pi)^1.5 * Rt * Rr) *
; (sqrt(Rt*Rr)/path_loss_ref_distance_m)^-(exp-2). exp=2.0 = exact radar
; equation; >2.0 adds excess loss beyond path_loss_ref_distance_m
; (indoor/clutter). TX->RX coupling/leakage is a separate one-way family
; and is never routed through this model.
target_path_loss_exp = 2.0
clutter_path_loss_exp = 2.3
reflection_path_loss_exp = 2.5
path_loss_ref_distance_m = 1.0
path_loss_floor_m = 0.1
; Calibration multiplier = (4*pi)^1.5 * path_loss_ref_distance_m^2 / lambda_m,
; evaluated ONCE at the default carrier_freq_hz. Keeps amplitude=1.0 at d=1m for
; rcs_m2=1 so noise_std, ADC clipping, quantization, and the Q8.8 hex codec
; elsewhere stay self-consistent. FIXED constant - do NOT recompute per carrier
; frequency: the physical lambda^1 dependence now lives in the formula, so
; re-deriving this from lambda_m would cancel it (lambda^0) and break
; cross-channel voltage scaling. Recompute only if path_loss_ref_distance_m changes.
; See docs/friis_path_loss_model.md for the derivation.
path_loss_ref_gain = 1186.830373866022

[cir]
num_bins = 256
bin_time_s = 0.0000000010016
num_frames = 256
noise_std = 0.02

[frontend]
enable_quantization = false
enable_adc_clipping = false
enable_frame_drift = false

[radar]
test_name = RADAR1
cir_taps = 256
; period unit ms; 5 ms chosen for estimation of velocity 1m/s
period = 5

[build]
; Use "now" to fill datetime.now().strftime("%Y-%m-%d %H:%M:%S") at runtime.
build_date = now

# The [profiles] values here are DEFAULTS for standalone/notebook callers of
# create_default_config(). When run through radar_wrapper, the pipeline's
# [synthetic] section overrides any of these three that it sets (override-if-present).
[profiles]
hardware_profile = ua200_realistic_v1
room_profile = small_room_center
target_profile = human_plus_object
# To drive impairments from a measurement fit instead of a preset, set:
#   hardware_profile = fitted
#   hardware_params_json = CIRgenerator/notebooks/outputs/impairments/case0_params.json
# The "fitted" profile injects noise + tx_rx_feedthrough + ringing from the JSON
# (quantization/frame_drift stay off), reproducing build_injected_simulator.
# hardware_params_json is resolved relative to the repo root when relative.
; ===================================================================
; Radar ego motion (slow-time radar pose)
; ===================================================================
; Models the CIR change caused by a user holding the radar-bearing device:
; the radar body acquires a per-slow-time-sample 6-DoF pose and the antenna
; phase centres ride along rigidly. Only geometry is updated; delay and
; carrier phase are recomputed from that geometry every frame, so Doppler is
; a derived consequence and is never applied as an extra phase term.
;
; See docs/ego_motion_model.md for the equations, the exact definition of the
; achieved RMS, the anchoring-induced DC/leakage caveat, and the limitations.
;
; type = static | sampled_pose | handheld_jitter
;   static (default, and what you get if this whole section is omitted)
;       reproduces the pre-ego-motion engine bit-for-bit.
;
; This section is optional, but WITHIN it the surface is STRICT: an unknown
; key, or a key belonging to a different `type`, is a hard error. A typo can
; never silently disable the motion.
[radar_motion]
type = handheld_jitter

; Non-negative 3-vectors in the INITIAL radar body frame (x, y, z).
; 1 mm of radial translation is ~19.2 deg of round-trip carrier phase at the
; Channel 9 carrier (lambda = 37.53 mm) but only ~0.0067 fast-time bins, so
; hand tremor is overwhelmingly a slow-time PHASE effect, not a delay effect.
; An axis set to 0.0 is exactly zero and is never renormalised.
translation_rms_local_m = 0.0012, 0.0012, 0.0008

; Radians. ~0.004 rad = 0.23 deg RMS, a plausible wrist-tremor tilt.
rotation_rms_local_rad = 0.004, 0.004, 0.002

; Requested band. Physiological hand tremor is ~8-12 Hz; essential tremor
; extends down to ~4 Hz. Runtime validation is stricter than the schema:
; 0 < min <= max, and max must be STRICTLY below the slow-time Nyquist
; frequency 1/(2*period). With [radar] period = 5 ms, Nyquist is 100 Hz.
min_frequency_hz = 4.0
max_frequency_hz = 12.0

; K, the number of sinusoidal components synthesised per axis. Must be > 0.
; Component mid-point frequencies are
;   f_k = min + (k + 1/2) * (max - min) / K,  k = 0 .. K-1
num_spectral_components = 24

; --- type = sampled_pose (recorded 6-DoF trajectory replay) ---------------
; Mutually exclusive with the handheld_jitter keys above; enabling both is a
; hard error, so this example stays commented out.
;
; [radar_motion]
; type = sampled_pose
; ; RELATIVE to this INI file's directory. Absolute paths are refused.
; ; Contents are body-local pose DELTAS relative to the base pose, not world
; ; poses, and the trace domain must cover the whole simulation slow-time grid
; ; (extrapolation is refused before any path is generated).
; file = traces/hand_demo.csv
; reference = base_pose_relative
; extrapolation = error
