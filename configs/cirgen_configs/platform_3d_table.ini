; platform_3d_table.ini (3d geometry, measured table_3d per-antenna pattern)
; Variant of platform_2d_legacy.ini demonstratring [scene] geometry_mode = 3d
; (previously only settable by directly assigning cfg.scene.geometry_mode in
; Python, e.g. validation/cir_validation_adapter.py::build_injected_simulator()
; - not reachable from any INI/wrapper config path until this file/the
; create_default_config() [scene] support were added).
;
; In "3d" mode the radar origin z = radar_height_z_m (see _radar_origin() /
; _build_antenna_positions() in CIRDataGenerator.py) instead of being forced
; to 0.0 as in "2d_legacy". All built-in target_profile branches still place
; targets at position_z_m = 0.0, so with the radar mounted above the target
; plane, theta_deg (polar angle from +z at the radar) genuinely departs from
; the flat-scene default of 90.0 (horizon) - it becomes > 90 (looking down),
; without needing any change to boresight_theta_deg or the antenna pattern
; itself. Combine with per-antenna table_3d patterns (as here) to see the
; pattern lookup actually sample a non-horizon theta_deg during the run.
;
; theta_deg convention (see CLAUDE.md / dataconfig.py vector_to_phi_theta_deg):
;   theta_deg = atan2(sqrt(dx^2+dy^2), dz), polar angle from +z.
;   theta_deg == 0      -> +z (straight up)
;   theta_deg == 90     -> horizon (x-y plane)
;   theta_deg == 180    -> -z (straight down)

[simulation]
num_antennas = 2

[scene]
geometry_mode = 3d
; Radar mounted 1.2m above the floor; targets stay at position_z_m = 0.0
; (all built-in target_profile branches), so this alone shifts theta_deg
; away from 90.0 without touching the antenna pattern/boresight config.
radar_height_z_m = 1.2

[antenna]
antenna_spacing_m = 0.019
; 7987.2 MHz - IEEE 802.15.4a/z UWB Channel 9 center frequency.
carrier_freq_hz = 7987200000.0
pattern_mode = table_3d
; Measured HFSS G(phi, theta) exports, linear-amplitude GainTotal column.
pattern_csv_ant0 = data/ant/260713/edge_dual_dipole_ant0_pattern.csv
pattern_csv_ant1 = data/ant/260713/edge_dual_dipole_ant1_pattern.csv
; boresight_deg is required by create_default_config() (no fallback) even
; though boresight_phi_deg/boresight_theta_deg supersede it for table_3d.
boresight_deg = 0.0
boresight_phi_deg = 0.0
; Boresight left at the default (+z / straight up) - the theta_deg shift
; away from 90.0 in this config comes from geometry_mode=3d radar height,
; not from an off-axis boresight (that's the boresight90 variant).
boresight_theta_deg = 0.0
min_gain = 0.05

; Round-trip radar-equation path-loss model (scattered echoes ONLY):
; amplitude ~ lambda*sqrt(rcs_m2)/((4*pi)^1.5 * Rt * Rr) *
; (sqrt(Rt*Rr))/path_loss_ref_distance_m)^2(exp-2). exp=2.0 = exact radar
; equation; >2.0 adds excess loss beyond path_loss_ref_distance_m
; (indoor/clutter). TX->RX coupling/leakage is a separate one-way family
; and is never routed through this model.
target_path_loss_exp = 2.0
clutter_path_loss_exp = 2.3
reflection_path_loss_exp = 2.5
path_loss_ref_distance_m = 1.0
path_loss_floor_m = 0.1
; Calibration multiplier = (4*pi)*1.5 * path_loss_ref_distance_m^2 / lambda_m,
; evaluate ONCE at the default carrier_freq_hz. Keeps amplitude=1.0 at d=1m for
; rcs_m2=1 so noise_std, ADC clipping, quantization, and the Q8.8 hex codec
; elsewhere stay self-consistent. FIXED constant - do NOT recompute per carrier
; frequency: the physical lambda^1 dependence now lives in the formula, so
; re-deriving this from lambda_m would cancel it (lambda^0) and break
; cross-channel volatage scaling. Recompute only if path_loss_ref_distance)m changes.
; See docs/friis_path_loss_model.md for the derivation.
path_loss_ref_gain = 1186.830373866022

[cir]
num_bins = 256
bin_time_s = 0.0000000010016
num_frames = 256
noise_std = 0.02

[frontend]
enable_quantization = false
enable_adc_clipping = false
enable_frame_drift = false

[radar]
test_name = RADAR1
cir_taps = 256
; period unit ms; 5 ms chosen for estimation of velocity m/s
period = 20

[build]
; Use "now" to fill datetime.now().strftime("%Y-%m-%d %H:%M:%S") at runtime.
build_date = now

# The [profiles] values here are DEFAULTS for standalone/notebook callers of
# create_default_config(). When run through radar_wrapper, the pipeline's
# [synthetic] section overrides any of these three that it sets (override-if-present).
[profiles]
hardware_profile = ideal_lab
room_profile = anechoic_like
target_profile = breathing_human

